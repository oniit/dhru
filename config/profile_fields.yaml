# type: text | choice | multi_choice
# roles: daftar peran yang field ini dipakai (jika tidak ada = semua peran)
# filter_by_field: untuk choice — filter opsi berdasarkan field lain di profil

fields:
  - key: full_name
    label: Nama lengkap
    type: text
    required: true

  - key: faculty
    label: Fakultas
    type: choice
    choices_key: faculties
    roles: [student, bem]
    required: true

  - key: major
    label: Jurusan
    type: choice
    choices_key: majors
    filter_by_field: faculty
    roles: [student, bem]
    required: true

  - key: club_enrolled
    label: Club / UKM
    type: multi_choice
    choices_key: clubs
    roles: [student, bem, internal, owner, admin]
    required: false

  - key: student_id
    label: NIM
    type: text
    roles: [student, bem]
    required: false

  - key: bem_position
    label: Jabatan BEM
    type: choice
    choices_key: bem_positions
    roles: [bem]
    required: true

  - key: position_detail
    label: Jabatan
    type: multi_choice
    choices_key: position_details
    roles: [owner, admin, internal]
    required: true

  - key: staff_faculty
    label: Fakultas
    type: choice
    choices_key: faculties
    roles: [owner, admin, internal]
    required: false

  - key: teaching_classes
    label: Kelas yang diampu
    type: multi_choice
    choices_key: classes
    roles: [owner, admin, internal]
    required: false

profile_display:
  - telegram_name
  - username
  - full_name
  - bem_position
  - position
  - position_detail
  - staff_faculty
  - teaching_classes
  - faculty
  - major
  - auto_class_enrolled
  - club_enrolled
  - total_sks
  - student_id
  - agra_total
