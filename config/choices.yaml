# Pilihan dropdown. `id` disimpan di profil; `label` tampil di bot.
# Untuk jurusan: isi `faculty` dengan id fakultas agar hanya muncul jika fakultas itu dipilih.

faculties:
  - id: fmipa
    label: Fakultas Matematika dan Ilmu Pengetahuan Alam
  - id: ftik
    label: Fakultas Ilmu Teknologi dan Komputer
  - id: fib
    label: Fakultas Ilmu Budaya

majors:
  - id: if
    label: Ilmu Fisika
    faculty: fmipa
  - id: ik
    label: Kimia
    faculty: fmipa
  - id: pm
    label: Pemrograman
    faculty: ftik
  - id: ki
    label: Keamanan Informasi
    faculty: ftik
  - id: ms
    label: Musik
    faculty: fib
  - id: kr
    label: Kreatif
    faculty: fib

classes:
  # Kuliah Umum (Otomatis untuk semua)
  - id: umum
    label: Kuliah Umum
    sks: 4
  
  # FMIPA - Ilmu Fisika
  - id: fd
    label: Fisika Dasar
    majors: if
    sks: 3
  - id: mf
    label: Matematika Fisika
    majors: if
    sks: 3
  
  # FMIPA - Kimia
  - id: kd
    label: Kimia Dasar
    majors: ik
    sks: 3
  - id: kdo
    label: Kimia Dasar Organik
    majors: ik
    sks: 3

  # FTIK - Pemrograman
  - id: pmd
    label: Pemrograman Dasar
    majors: pm
    sks: 3
  - id: ddp
    label: Dasar-Dasar Python
    majors: pm
    sks: 3

  # FTIK - Keamanan Informasi
  - id: ks
    label: Keamanan Siber
    majors: ki
    sks: 3
  - id: aks
    label: Analisis Kejahatan Siber
    majors: ki
    sks: 3

  # FIB - Musik
  - id: sm
    label: Sejarah Musik
    majors: ms
    sks: 3
  - id: mp
    label: Membaca Partitur
    majors: ms
    sks: 3

  # FIB - Kreatif
  - id: dg
    label: Desain Grafis
    majors: kr
    sks: 3
  - id: st
    label: Storytelling
    majors: kr
    sks: 3

